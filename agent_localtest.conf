agent {
  proxy.hostname = localhost
  admin.enabled: false
  metrics.enabled: true

  pathConfigs: [
    {
      name: "App1 metrics"
      path: app1_metrics
      url: "http://localhost:9100/metrics"
    }
    # 사설망 Prometheus의 /federate를 scrape하는 경우 (federation)
    # 서버마다가 아니라 클러스터마다 하나씩 등록
    # match[]: 가져올 시계열 셀렉터 (필수). {job!=""}이면 전체
    #   .+ 정규식 금지: 쿼리스트링에서 +가 공백으로 해석되어 셀렉터가 깨짐
    # {
    #   name: "cluster-a prometheus"
    #   path: cluster-a
    #   url: "http://localhost:9090/federate?match[]={job!=\"\"}"
    # }
  ]
}
